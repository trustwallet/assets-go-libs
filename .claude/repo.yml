summary: |-
  Go library for Trust Wallet assets repository automation — validation, path parsing, and file classification for blockchain token/coin metadata additions.

  Route here for: ValidateAsset, ValidateCoin, ValidateTokenList, file path type classification (TypeAssetFolder, TypeChainInfoFile, …), EVM/TRON/Cosmos/Waves address validation, PNG logo dimension/size checks, assets-manager HTTP client, tokenlist cross-validation against info.json, validator-list entry validation.

